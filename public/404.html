<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Webix</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; padding: 1rem; background: #070b14; color: #f4f1ea; font-family: Inter, system-ui, sans-serif; text-align: center; }
      h1 { margin: 0; font-size: 4.5rem; }
      h2 { margin: 1rem 0 0; font-size: 1.25rem; }
      p { margin: 0.5rem 0 1.75rem; color: rgb(244 241 234 / 0.7); }
      a { display: inline-block; padding: 0.75em 1.6em; border: 2px solid #0b0f1a; border-radius: 999px; background: #ffda24; color: #1a253a; font-weight: 700; text-decoration: none; box-shadow: 0 5px 0 #e81a2e, 0 7px 0 #0b0f1a; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
